[project]
name = "model-router"
version = "0.1.0"
description = "Routes Claude Code work to subagents on fixed models and effort levels."
requires-python = ">=3.12"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "S", "PT", "N", "C90", "PLR"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
# pytest's assertion rewriting relies on bare assert, and test tables use literal values.
"tests/**" = ["S101", "PLR2004"]

[tool.mypy]
strict = true
files = ["scripts", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts"]
